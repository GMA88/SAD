version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sad_erp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./erp_database.db:/app/erp_database.db
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sad_erp_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge
